[package]
name = "voxmelody"
version = "0.1.0"
description = "Generate voice and music offline"
authors = ["VoxMelody contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/akhil272/voxmelody"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "voxmelody_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "sync", "time", "macros"] }
sha2 = "0.11.1"
hex = "0.4.3"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2.8.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[profile.dev.package.sha2]
opt-level = 3
